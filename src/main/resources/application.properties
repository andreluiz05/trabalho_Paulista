spring.config.import=optional:dotenv:./.env

# 1. URL limpa (sem usuário e senha misturados no meio)
spring.datasource.url=${DB_URL}

# 2. Usuário e Senha isolados para melhor segurança e clareza
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 3. Configurações do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
security.jwt.protection-enabled=${JWT_PROTECTION_ENABLED:true}

# Swagger UI
# true  = ativa o painel em /swagger-ui/index.html
# false = desativa o painel visual do Swagger
springdoc.swagger-ui.enabled=true
